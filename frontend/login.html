<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>split — log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="landing">
    <div class="logo-emoji">🐿️</div>
    <h1>split</h1>
    <p class="tagline">Log in to see all your trips in one place.</p>

    <div class="card-form">
      <div class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" placeholder="you@example.com" maxlength="254" />
      </div>

      <div class="field">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" placeholder="At least 8 characters" maxlength="128" />
      </div>

      <button type="button" class="btn primary" id="login-btn" style="width:100%;">Log in</button>
      <button type="button" class="btn secondary" id="signup-btn" style="width:100%; margin-top:8px;">Sign up instead</button>
      <p id="auth-error" class="split-hint error" style="display:none;"></p>
    </div>

    <p class="tagline" style="margin-top:24px;">
      <a href="index.html">← Back to creating a trip</a>
    </p>
  </div>

  <div id="toast" class="toast"></div>

 <script>
    window.SPLIT_API_BASE = "https://splitapp-api-fuku.onrender.com";
</script>
<script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
