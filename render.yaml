services:
  - type: web
    name: splitclone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splitclone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: splitclone-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .

databases:
  - name: splitclone-db
    plan: free
    databaseName: splitdb
    user: splitdb
